# Local preview only. Cloudflare Pages serves public/ directly and never reads this.
services:
  portfolio:
    image: nginx:alpine
    container_name: portfolio-preview
    ports:
      - "8080:80"
    volumes:
      # Only public/ is mounted - it is the exact tree Pages publishes, so what you
      # see at localhost:8080 is what ships.
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
