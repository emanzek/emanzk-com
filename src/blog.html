<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing — emanzk.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04101c;--fg:#E6F1FF;--fg-2:#8FB0C9;--fg-3:#5B7A94;--hud:#22D3EE;
--line:rgba(34,211,238,.38);--line-2:rgba(34,211,238,.14);--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;background-color:var(--bg)}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(rgba(34,211,238,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.08) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px}
#scan{position:fixed;left:0;right:0;top:-2px;height:2px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.4),transparent);z-index:3;pointer-events:none;animation:scan 9s linear infinite}
@keyframes scan{from{top:-2px}to{top:100%}}
.corner{position:fixed;width:18px;height:18px;border:0 solid var(--line);z-index:15;pointer-events:none}
.corner.tl{top:14px;left:14px;border-width:1px 0 0 1px}.corner.tr{top:14px;right:14px;border-width:1px 1px 0 0}
.corner.bl{bottom:14px;left:14px;border-width:0 0 1px 1px}.corner.br{bottom:14px;right:14px;border-width:0 1px 1px 0}
nav{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:24px;padding:16px 40px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(rgba(4,16,28,.96),rgba(4,16,28,.82));border-bottom:1px solid var(--line-2);backdrop-filter:blur(6px)}
nav .brand{font-weight:700;display:flex;gap:9px;align-items:center;color:var(--fg)}nav .brand i{width:7px;height:7px;border-radius:50%;background:var(--hud);box-shadow:0 0 10px var(--hud)}
nav a{color:var(--fg-2);text-decoration:none}nav a:hover{color:var(--hud)}nav .sp{margin-left:auto}
:focus-visible{outline:1px solid var(--hud);outline-offset:3px}
main{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:56px 28px 120px}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--hud);margin:0 0 10px;text-shadow:0 0 8px rgba(34,211,238,.35)}
h1{font-size:clamp(30px,4.4vw,44px);line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;font-weight:600;max-width:22ch}
.lede{color:var(--fg-2);font-size:17px;margin:0 0 40px;max-width:62ch}
.post-list{list-style:none;padding:0;margin:0}
.post-list li{border-top:1px solid var(--line-2);padding:22px 0}
.post-list li:last-child{border-bottom:1px solid var(--line-2)}
.post-list a{text-decoration:none;color:inherit;display:block}
.post-list a:hover h2{color:var(--hud)}
.post-list h2{font-size:21px;line-height:1.3;letter-spacing:-.015em;margin:0 0 6px;font-weight:600;transition:color .18s}
.post-list p{margin:0 0 8px;color:var(--fg-2);font-size:15px;max-width:64ch}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);letter-spacing:.04em;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tag{border:1px solid var(--line-2);border-radius:99px;padding:2px 9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
article h1{margin-bottom:12px}
article h2{font-size:20px;letter-spacing:-.01em;margin:36px 0 10px;font-weight:600}
article p{margin:0 0 16px;max-width:70ch;color:#D6E6F6}
article ul{margin:0 0 16px;padding-left:20px;color:#D6E6F6;max-width:70ch}article li{margin-bottom:7px}
article code{font-family:var(--mono);font-size:.88em;background:rgba(34,211,238,.1);border:1px solid var(--line-2);border-radius:3px;padding:1px 5px;color:#BFE9F5}
article pre{background:rgba(4,16,28,.85);border:1px solid var(--line);border-radius:3px;padding:14px 16px;overflow-x:auto;margin:0 0 20px;position:relative}
article pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.6;color:#9FD8E6}
article pre::before,article pre::after{content:'';position:absolute;width:10px;height:10px;border:0 solid var(--hud)}
article pre::before{top:-1px;left:-1px;border-width:2px 0 0 2px}article pre::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
article blockquote{margin:0 0 18px;padding:2px 0 2px 16px;border-left:2px solid var(--hud);color:var(--fg-2);max-width:68ch}
.rule{border:0;border-top:1px solid var(--line-2);margin:44px 0 28px}
.pager{display:flex;justify-content:space-between;gap:20px;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
.pager a{color:var(--fg-2);text-decoration:none;max-width:46%}.pager a:hover{color:var(--hud)}
.pager span{display:block;color:var(--fg-3);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
@media(max-width:700px){nav{padding:12px 16px;gap:14px}main{padding:36px 18px 80px}.corner{display:none}}
@media(prefers-reduced-motion:reduce){#scan{display:none}}
</style></head><body>
<div id="grid"></div><div id="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<script src="content.js"></script><script src="blog.js"></script>
</body></html>
